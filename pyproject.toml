[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluewhale-shadow-phone"
version = "0.1.0"
description = "Bluewhale Shadow Phone —— Android 模拟器上的 GUI Agent（Observe → Think → Act → Verify）"
requires-python = ">=3.11"
# V4 §9：直接依赖**钉死版本**，完整依赖图锁在 uv.lock（`uv sync` 可复现同一套环境）。
# 升级流程：`uv lock --upgrade` → 跑全量测试 → 与 uv.lock 一起提交。
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "httpx==0.28.1",
]

# 测试依赖放在 dev extra（审核 §9）：生产环境不该装 pytest。
# 另外提供 requirements-dev.txt，给不用 uv 的环境一条 `pip install -r` 的路。
[project.optional-dependencies]
dev = ["pytest==9.1.1"]

# 显式声明顶层包，避免 setuptools 自动发现在 _ref_extract/ 等参考目录上踩坑
[tool.setuptools]
packages = ["agent", "api", "device", "models", "vision"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
